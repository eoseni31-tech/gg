<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safiyah’s Gleam — Couple Dashboard</title><style>:root{--wine:#481821;--cream:#faf6ef;--gold:#b28a4c;--ink:#352a2b;--muted:#766866;--line:#e5dcd1}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 system-ui,sans-serif}h1,h2,h3,.brand{font-family:Georgia,serif;font-weight:400;line-height:1.2}h1{font-size:44px;margin:14px 0}h2{font-size:28px}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button,a{touch-action:manipulation}button,.button{cursor:pointer;padding:11px 18px;border:1px solid var(--wine);border-radius:6px;background:var(--wine);color:white;text-decoration:none;display:inline-block}button.secondary,.button.secondary{background:transparent;color:var(--wine);border-color:var(--line)}button:disabled{opacity:.5;cursor:wait}a{color:var(--wine)}input,select,textarea{width:100%;padding:12px;border:1px solid #c9bcb0;border-radius:5px;background:#fff;color:var(--ink)}label{display:block;margin:18px 0 7px}textarea{min-height:90px}.login{max-width:480px;margin:8vh auto;padding:40px;background:white;border:1px solid var(--line);border-radius:12px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.login h1{font-size:38px}.login button{margin-top:24px;width:100%}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--wine);color:var(--cream);padding:35px 24px;display:flex;flex-direction:column;gap:28px}.brand{font-size:25px}.brand small{display:block;font:10px system-ui;letter-spacing:.2em;margin-top:10px}nav{display:grid;gap:8px}nav a{padding:12px;border-radius:6px;color:#ead7d2;text-decoration:none}nav a.active{background:#ffffff19;color:white}aside button{margin-top:auto;border-color:#ffffff40}main{padding:40px 5vw;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.top select{width:auto;max-width:300px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:30px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:9px;padding:24px}.card strong{font:36px Georgia;display:block;margin-top:10px}.panel{margin:24px 0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.controls input{flex:1;min-width:180px}.controls select{width:auto}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td,th{padding:16px 12px;border-bottom:1px solid var(--line);vertical-align:top}td button{font-size:12px;padding:7px 10px;margin:3px;white-space:nowrap}.badge{display:inline-block;background:#f2e8dc;padding:3px 9px;border-radius:20px;font-size:12px}.badge.received{background:#e4eee3;color:#315436}.empty{padding:44px;text-align:center;color:var(--muted)}.error{color:#9b2020;background:#fff0ef;padding:15px;border-radius:6px}.success{color:#315436;background:#eaf2e7;padding:15px;border-radius:6px}.pagination{display:flex;gap:15px;align-items:center;justify-content:flex-end;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.loading{padding:30px}dialog{border:1px solid var(--line);border-radius:12px;max-width:570px;width:calc(100% - 32px);max-height:90vh;padding:30px;background:var(--cream);color:var(--ink)}dialog::backdrop{background:#17080b99}dialog h2{margin-top:0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.history details{border-bottom:1px solid var(--line);padding:12px 0}footer{font-size:12px;color:var(--muted);margin-top:40px}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{padding:20px;gap:15px}nav{display:flex;overflow-x:auto}nav a{white-space:nowrap}aside button{margin:0;align-self:start}main{padding:25px 20px}h1{font-size:35px}.login{margin:30px 16px;padding:28px}.grid{grid-template-columns:1fr}.top select{max-width:100%}.panel{padding:18px}.card{padding:18px}}
.login .button{display:block;text-align:center;margin:24px 0}aside .button{color:white;border-color:#ffffff40}fieldset{border:1px solid var(--line);border-radius:6px;margin-bottom:20px}#invite-result input{font-size:12px;word-break:break-all;margin-bottom:24px}
</style></head><body><div id="app"><p class="loading">Opening your wedding space…</p></div><script type="module">window.SG_CONFIG={guestOrigin:location.origin};if(location.protocol!=='file:'){try{await import('/config.js')}catch{}}
if(location.pathname==='/admin'){
const GUEST_ORIGIN=window.SG_CONFIG.guestOrigin;
const app=document.querySelector('#app');let csrf='',weddings=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Please try again.');return d}function error(e){const n=document.querySelector('#notice');n.className='error';n.textContent=e.message}async function render(){weddings=await api('/api/admin/weddings');app.innerHTML=`<div class="shell"><aside><div class="brand">Safiyah’s Gleam<small>PLATFORM MANAGEMENT</small></div><nav><a class="active" href="/admin">Couples & access codes</a><a href="/dashboard">Wedding dashboard</a><a href="${GUEST_ORIGIN}/">Guest website</a></nav><button id="logout">Sign out</button></aside><main><div class="eyebrow">Your couples, beautifully organised</div><h1>Wedding spaces & access.</h1><p class="muted">Create each wedding, then assign its private couple code. Only you can issue or replace codes.</p><div id="notice" role="status"></div><section class="panel"><h2>Your wedding spaces</h2><div class="table-wrap"><table><thead><tr><th>Wedding</th><th>Guest link</th><th>Private access</th></tr></thead><tbody>${weddings.map(w=>`<tr><td>${esc(w.title)}</td><td><a target="_blank" rel="noopener" href="${GUEST_ORIGIN}/?wedding=${esc(w.slug)}">Open invitation</a></td><td><button data-code="${w.id}">Assign / replace code</button></td></tr>`).join('')}</tbody></table></div></section><form id="create" class="panel"><h2>Add a couple</h2><div class="grid"><label>Wedding / couple name<input name="title" maxlength="150" required></label><label>Public invitation address<input name="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="ada-and-daniel" maxlength="100"></label><label>Contact email (optional)<input name="email" type="email" maxlength="254"></label><label>Open invitation party limit<input name="max_party" type="number" min="1" max="20" value="1" required></label></div><button>Create wedding space</button><p class="muted">New weddings use this concept’s design. Personalise each couple’s photos and story before sharing a real invitation.</p></form><section class="panel"><h2>Your owner access code</h2><p>Keep your owner code private. Use a different code from every couple. Changing it signs you out.</p><form id="owner-code"><label>New owner code<input name="code" type="password" minlength="16" maxlength="128" required></label><button>Replace owner code</button></form></section></main></div>`;await recoveries();document.querySelector('#owner-code').onsubmit=async e=>{e.preventDefault();if(!confirm('Replace your owner code and sign out? Keep the new code safely.'))return;try{await api('/api/admin/owner-code',{code:new FormData(e.target).get('code')});location.href='/couple-login'}catch(e){error(e)}};document.querySelector('#logout').onclick=async()=>{await api('/api/logout',{});location.href='/couple-login'};document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>codeDialog(weddings.find(w=>w.id===b.dataset.code)));document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const b=e.target.querySelector('button');b.disabled=true;try{const w=await api('/api/admin/weddings',{title:f.get('title'),slug:f.get('slug'),email:f.get('email'),max_party:Number(f.get('max_party'))});await render();codeDialog(w)}catch(e){error(e);b.disabled=false}}}
function codeDialog(w){const d=document.createElement('dialog');d.innerHTML=`<h2>Private access for ${esc(w.title)}</h2><p>Assign this code only to this couple. Replacing a code signs out their existing sessions.</p><div role="alert" id="dialog-error"></div><form><label>Access code<input name="code" minlength="16" maxlength="128" autocomplete="off" required></label><label>Private couple password<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button type="button" class="secondary" id="generate">Generate secure code</button><p class="muted">Use the generator or enter at least 16 characters. Codes are saved as secure hashes and cannot be retrieved later.</p><div class="actions"><button type="button" class="secondary" id="close">Cancel</button><button>Assign code</button></div></form>`;document.body.append(d);d.showModal();d.onclose=()=>d.remove();d.querySelector('#close').onclick=()=>d.close();d.querySelector('#generate').onclick=()=>{d.querySelector('input').value=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')};d.querySelector('#generate').click();d.querySelector('form').onsubmit=async e=>{e.preventDefault();if(!confirm('Assign this code? Any previous couple code will stop working.'))return;const btn=e.target.querySelector('button:not([type])');btn.disabled=true;const code=new FormData(e.target).get('code');try{await api('/api/admin/code',{wedding_id:w.id,code,password:new FormData(e.target).get('password')});d.innerHTML='<h2>Code assigned.</h2><p>Send this private code and the couple sign-in link through your established private contact channel. It will not be shown again after you close this window.</p><label>Couple code<input readonly></label><label>Sign-in link<input readonly id="signin"></label><div class="actions"><button id="done">Done</button></div>';d.querySelector('input').value=code;d.querySelector('#signin').value=location.origin+'/couple-login';d.querySelector('#done').onclick=()=>d.close()}catch(e){const n=d.querySelector('#dialog-error');n.className='error';n.textContent=e.message;btn.disabled=false}}}
try{const me=await api('/api/me');if(!me.is_admin){app.innerHTML='<main class="login"><h1>Owner access only.</h1><p>This account can manage its own wedding in the couple dashboard.</p><a class="button" href="/dashboard">Open wedding dashboard</a></main>'}else{csrf=me.csrf;await render()}}catch{location.href='/couple-login'}

async function recoveries(){const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Access recovery requests</h2><p class="muted">Verify the requester through your established contact channel before replacing their code. This form is not proof of identity.</p>';document.querySelector('main').append(panel);const rows=await api('/api/admin/recovery');panel.innerHTML+=rows.length?`<div class="table-wrap"><table><thead><tr><th>Wedding</th><th>Contact</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.contact)}</td><td>${esc(r.status)}</td><td>${r.status==='pending'?`<button class="secondary" data-close-recovery="${r.id}">Mark handled</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p>No recovery requests.</p>';panel.querySelectorAll('[data-close-recovery]').forEach(b=>b.onclick=async()=>{if(!confirm('Mark this recovery request handled? Verify identity and assign the replacement code first.'))return;await api('/api/admin/recovery',{id:b.dataset.closeRecovery});await render()})}

}else if(location.pathname==='/reset-password'){
document.querySelector('#recovery').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),n=document.querySelector('#notice');b.disabled=true;try{const f=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});const d=await r.json();if(!r.ok)throw Error(d.error||'Please try again.');n.className='success';n.textContent=d.message;e.target.reset()}catch(e){n.className='error';n.textContent=e.message}finally{b.disabled=false}};

}else{
const GUEST_ORIGIN=window.SG_CONFIG.guestOrigin;
const app=document.querySelector('#app');let me,wedding,csrf='',page=1,filter='',search='',order='newest';let rsvps=[],gifts=[],summary,refresh;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(n/100);
async function api(path,body,method='POST'){if(location.protocol==='file:')throw Error('Deploy this page together with its backend to sign in and save records.');const r=await fetch(path,{credentials:'same-origin',...(body?{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not complete request.');return data}
const base=()=>'/api/weddings/'+wedding.id;
function error(e){let el=document.querySelector('#notice');if(!el){el=document.createElement('div');el.id='notice';app.prepend(el)}el.className='error';el.setAttribute('role','alert');el.textContent=e.message}
function section(){return location.pathname.split('/')[2]||'overview'}
function shell(){app.innerHTML=`<div class="shell"><aside><div class="brand">Safiyah’s Gleam<small>YOUR WEDDING, BEAUTIFULLY ORGANISED</small></div><nav>${[['overview','Overview','/dashboard'],['rsvp','RSVPs','/dashboard/rsvp'],['guests','Guest list','/dashboard/guests'],['gifts','Gift ledger','/dashboard/gifts'],['settings','Settings','/dashboard/settings']].map(([k,n,p])=>`<a class="${section()===k?'active':''}" href="${p}">${n}</a>`).join('')}</nav><button id="logout">Sign out</button></aside><main><header class="top"><div><div class="eyebrow">Your private wedding space</div><h1>${esc(wedding.title)}</h1><p class="muted" id="sync">Refreshing your records…</p></div><select id="wedding" aria-label="Choose wedding">${me.weddings.map(w=>`<option value="${w.id}" ${w.id===wedding.id?'selected':''}>${esc(w.title)}</option>`).join('')}</select></header><div id="notice" role="status"></div><div id="content"></div><footer>Gift reports remain unverified until you confirm receipt. Online payments are not configured.</footer></main></div>`;document.querySelector('#logout').onclick=async()=>{await api('/api/logout',{});location.href='/couple-login'};document.querySelector('#wedding').onchange=async e=>{wedding=me.weddings.find(w=>w.id===e.target.value);sessionStorage.setItem('sg-selected-wedding',wedding.id);page=1;shell();await load()}}
function cards(){return `<div class="cards">${[['Responses',summary.responses],['People attending',summary.attendees],['Unable to attend',summary.declined],['Awaiting response',summary.not_responded===null?'—':summary.not_responded]].map(([l,n])=>`<div class="card"><div class="muted">${l}</div><strong>${n}</strong>${l==='Awaiting response'&&summary.not_responded===null?'<small>No invitation list has been added.</small>':''}</div>`).join('')}</div>`}
function giftCards(){return summary.gifts.length?summary.gifts.map(g=>`<div class="cards"><div class="card">Received · ${g.currency}<strong>${money(g.confirmed_minor,g.currency)}</strong><small>${g.confirmed_count} gifts confirmed by the couple</small></div><div class="card">Reported · ${g.currency}<strong>${money(g.reported_minor,g.currency)}</strong><small>${g.pending_count} awaiting verification</small></div></div>`).join(''):'<div class="panel empty">No gifts recorded yet. Your ledger starts with real records.</div>'}
function controls(type){return `<div class="controls"><input id="search" placeholder="Search guest names" aria-label="Search guest names" value="${esc(search)}"><select id="filter" aria-label="Filter status"><option value="">All statuses</option>${(type==='rsvp'?[['1','Attending'],['0','Declined']]:[['reported','Reported'],['received','Received'],['void','Void']]).map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select><select id="sort" aria-label="Sort records"><option value="newest" ${order==='newest'?'selected':''}>Newest first</option><option value="name" ${order==='name'?'selected':''}>Name A–Z</option></select></div>`}
function rows(type){let data=(type==='rsvp'?rsvps:gifts).filter(r=>r.guest_name.toLowerCase().includes(search.toLowerCase())&&(filter===''||String(type==='rsvp'?r.attending:r.status)===filter));data.sort((a,b)=>order==='name'?a.guest_name.localeCompare(b.guest_name):b.updated_at.localeCompare(a.updated_at));const pages=Math.max(1,Math.ceil(data.length/15));page=Math.min(page,pages);const visible=data.slice((page-1)*15,page*15);return {visible,pages,total:data.length}}
function table(type){const {visible,pages,total}=rows(type);return `<div id="records"><div class="table-wrap"><table><thead><tr>${(type==='rsvp'?['Guest','Response','Party','Events','Submitted','Notes']:['Gift / donor','Amount','Source / method','Status','Date','Actions']).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${visible.map(r=>type==='rsvp'?`<tr><td>${esc(r.guest_name)}</td><td><span class="badge">${r.attending?'Attending':'Declined'}</span></td><td>${r.party}</td><td>${r.events.map(e=>esc(e.name)).join('<br>')}</td><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.notes)}</td></tr>`:`<tr><td>${esc(r.guest_name)||'Anonymous'}<br><small>${esc(r.id)}</small></td><td>${money(r.amount_minor,r.currency)}</td><td>${r.source==='guest_report'?'Guest reported':'Couple recorded'}<br>${r.method==='cash'?'Cash':'Bank transfer'}${r.reference?'<br>Reference: '+esc(r.reference):''}</td><td><span class="badge ${r.status}">${r.status==='received'?'Received · couple confirmed':r.status}</span></td><td>${new Date(r.created_at).toLocaleDateString()}</td><td><button class="secondary" data-edit="${r.id}">Edit / verify</button></td></tr>`).join('')}</tbody></table>${total?'':'<div class="empty">No matching records yet.</div>'}</div><div class="pagination"><small>${total} records · Page ${page} of ${pages}</small><button id="prev" class="secondary" ${page===1?'disabled':''}>Previous</button><button id="next" class="secondary" ${page===pages?'disabled':''}>Next</button></div></div>`}
function bindTables(type){document.querySelector('#search').oninput=e=>{search=e.target.value;page=1;updateTable(type)};document.querySelector('#filter').onchange=e=>{filter=e.target.value;page=1;updateTable(type)};document.querySelector('#sort').onchange=e=>{order=e.target.value;page=1;updateTable(type)};bindRows(type)}
function updateTable(type){document.querySelector('#records').outerHTML=table(type);bindRows(type)}
function bindRows(type){document.querySelector('#prev').onclick=()=>{page--;updateTable(type)};document.querySelector('#next').onclick=()=>{page++;updateTable(type)};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>giftForm(gifts.find(g=>g.id===b.dataset.edit)))}
function render(){const content=document.querySelector('#content');switch(section()){
 case 'overview':content.innerHTML=cards()+`<h2>Given with love</h2>`+giftCards()+`<div class="panel"><h2>A place for everyone in your story.</h2><p>RSVPs and gift notifications from your connected invitation arrive here automatically.</p><a class="button" href="${GUEST_ORIGIN}/?wedding=${esc(wedding.slug)}" target="_blank" rel="noopener">Open connected wedding page</a></div>`;break;
 case 'rsvp':content.innerHTML='<div id="metrics">'+cards()+'</div>'+`<div class="top"><h2>Your guests</h2><a class="button secondary" href="${base()}/export">Export CSV</a></div>`+controls('rsvp')+table('rsvp');bindTables('rsvp');inviteList();break;
 case 'gifts':content.innerHTML=`<div class="top"><h2>Your gift ledger</h2><button id="add">Record a gift</button></div><p class="muted">Received totals reflect your confirmation of cash or external bank transfers. They are not payment-provider verified.</p>`+'<div id="metrics">'+giftCards()+'</div>'+controls('gifts')+table('gifts')+`<button class="secondary" id="history">View audit history</button><div id="history-content" class="panel history" hidden></div>`;bindTables('gifts');document.querySelector('#add').onclick=()=>giftForm();document.querySelector('#history').onclick=async()=>{try{const items=await api(base()+'/audit');const el=document.querySelector('#history-content');el.hidden=false;el.innerHTML=items.length?items.map(a=>`<details><summary>${esc(a.action)} · ${new Date(a.created_at).toLocaleString()}</summary><p>Actor: ${esc(a.actor_id)||'Public guest'}</p><p>Before</p><pre>${esc(a.before_json||'—')}</pre><p>After</p><pre>${esc(a.after_json||'—')}</pre></details>`).join(''):'No changes recorded yet.'}catch(e){error(e)}};break;
 case 'guests':content.innerHTML='<h2>Your guest list</h2><p class="muted">Personal invitations and response status.</p>';inviteList();break;case 'settings':settings();break;
 }}
async function settings(){try{const data=await api(base()+'/settings');document.querySelector('#content').innerHTML=`<form class="panel" id="settings"><h2>Your celebration settings</h2><label>Wedding title<input name="title" maxlength="150" value="${esc(data.wedding.title)}" required></label><label>Maximum party size for open RSVPs<input name="max" type="number" min="1" max="20" value="${data.wedding.max_party}" required></label><p class="muted">Individual invitation links may have their own party limits. Dates entered below use the wedding’s local time.</p>${data.events.map((e,i)=>`<fieldset><legend>Event ${i+1}</legend><label>Name<input name="name-${i}" maxlength="120" value="${esc(e.name)}" required></label><label>Date and time<input name="date-${i}" type="datetime-local" value="${esc(e.date)}"></label></fieldset>`).join('')}<div class="actions"><button>Save settings</button></div></form>`;document.querySelector('#settings').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api(base()+'/settings',{title:f.get('title'),max_party:Number(f.get('max')),events:data.events.map((ev,i)=>({id:ev.id,name:f.get('name-'+i),date:f.get('date-'+i)}))},'PATCH');wedding.title=f.get('title');document.querySelector('h1').textContent=wedding.title;document.querySelector('#notice').className='success';document.querySelector('#notice').textContent='Settings saved.'}catch(e){error(e)}}}catch(e){error(e)}}
function giftForm(g){const d=document.createElement('dialog');d.innerHTML=`<h2>${g?'Review this gift':'Record a gift'}</h2><p class="muted">Only mark received after checking the cash or transfer yourself.</p><div class="form-error" role="alert"></div><form><label>Guest name (optional)<input name="guest_name" maxlength="120" value="${esc(g?.guest_name)}"></label><div class="grid"><label>Amount<input name="amount" inputmode="decimal" pattern="[0-9]+(\\.[0-9]{1,2})?" value="${g?(g.amount_minor/100).toFixed(2):''}" ${g?.status==='received'?'readonly':''} required></label><label>Currency<select name="currency" ${g?'disabled':''}>${['NGN','USD','GBP','EUR'].map(c=>`<option ${g?.currency===c?'selected':''}>${c}</option>`).join('')}</select></label></div><label>Method<select name="method" ${g?'disabled':''}><option value="cash">Cash</option><option value="bank_transfer" ${g?.method==='bank_transfer'?'selected':''}>External bank transfer</option></select></label>${g?`<label>Status<select name="status">${['reported','received','void'].map(s=>`<option ${g.status===s?'selected':''}>${s}</option>`).join('')}</select></label>`:'<p>New records start as reported. Verify receipt in a separate step.</p>'}<label>Notes<textarea name="notes" maxlength="1000">${esc(g?.notes)}</textarea></label><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button>Save gift</button></div></form>`;document.body.append(d);d.showModal();d.querySelector('#cancel').onclick=()=>d.close();d.onclose=()=>d.remove();const request=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');d.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),btn=e.target.querySelector('button[type="submit"],button:not([type])');if(g&&f.status!==g.status&&!confirm(`Change this gift to ${f.status}? Only confirm receipt after checking the funds.`))return;btn.disabled=true;try{await api(base()+'/gifts'+(g?'/'+g.id:''),{...f,request_key:request,...(g?{expected_updated_at:g.updated_at}:{})},g?'PATCH':'POST');d.close();await load()}catch(e){d.querySelector('.form-error').className='form-error error';d.querySelector('.form-error').textContent=e.message;btn.disabled=false}}}
async function load(quiet=false){try{[summary,rsvps,gifts]=await Promise.all([api(base()+'/summary'),api(base()+'/rsvps'),api(base()+'/gifts')]);document.querySelector('#sync').textContent='Updated '+new Date().toLocaleTimeString()+' · refreshes every 10 seconds';if(!quiet)render();else if(section()==='overview')render();else if(section()==='guests'){document.querySelector('#content').innerHTML='<h2>Your guest list</h2>';inviteList();}else if(section()==='rsvp'||section()==='gifts'){updateTable(section());document.querySelector('#metrics').innerHTML=section()==='rsvp'?cards():giftCards()}}catch(e){if(e.message.includes('sign in'))location.href='/couple-login';else error(e)}}
if(location.protocol==='file:'||location.pathname==='/'||location.pathname==='/index.html'||location.pathname==='/couple-login'||location.pathname==='/couple.html'||location.pathname==='/couple')codeLogin();else{try{me=await api('/api/me');csrf=me.csrf;if(!me.weddings.length||new URL(location.href).searchParams.has('new')){app.innerHTML='<main class="login"><h1>Your wedding space is being prepared.</h1><p>Ask Safiyah’s Gleam to link your wedding to this code.</p></main>'}else{wedding=me.weddings.find(w=>w.id===sessionStorage.getItem('sg-selected-wedding'))||me.weddings[0];shell();await load();refresh=setInterval(()=>{if(!document.hidden&&!document.querySelector('dialog')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))load(true)},10000)}}catch{location.href='/couple-login'}}

async function inviteList(){const el=document.createElement('section');el.className='panel';el.innerHTML=`<h2>Your invitation list</h2><p class="muted">Create personal invitation links to track who has not responded. Copy each private link when it is created.</p><form id="invite-create"><div class="grid"><label>Guest name<input name="name" maxlength="120" required></label><label>Maximum party size<input name="max_party" type="number" min="1" max="20" value="1" required></label></div><button>Add invitation</button></form><div id="invite-result" role="status"></div><div id="invite-list"></div>`;document.querySelector('#content').append(el);async function reload(){const rows=await api(base()+'/invitees');el.querySelector('#invite-list').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Guest</th><th>Party limit</th><th>Response</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.max_party}</td><td>${r.responded?'Responded':'Awaiting response'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No invitation list added.</p>'}try{await reload()}catch(e){error(e)}el.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const b=e.target.querySelector('button');b.disabled=true;try{const result=await api(base()+'/invitees',{name:f.get('name'),max_party:Number(f.get('max_party'))});const out=el.querySelector('#invite-result');out.innerHTML='<p>Copy this private invitation link and send it only to this guest:</p><input readonly aria-label="Private invitation link">';out.querySelector('input').value=GUEST_ORIGIN+'/?wedding='+encodeURIComponent(wedding.slug)+'&invitation='+encodeURIComponent(new URL(result.url,location.origin).searchParams.get('invitation'));await reload();e.target.reset();await load(true)}catch(e){error(e)}finally{b.disabled=false}}}

function codeLogin(){app.innerHTML=`<main class="login"><div class="eyebrow">Safiyah’s Gleam Weddings</div><h1>Your wedding space.</h1><p class="muted">Enter your wedding access code and private password.</p><div id="notice" role="alert"></div><form id="code-login"><label for="access-code">Private access code</label><input id="access-code" name="code" type="password" autocomplete="current-password" minlength="3" maxlength="128" required><label for="private-password">Private password</label><input id="private-password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required><button>Open our wedding dashboard</button></form><p class="muted">The initial wedding code is OO1 (letter O, letter O, number 1). Your private password is required as well. Need a replacement code? Contact Safiyah’s Gleam through your existing support channel. Keep your code private.</p><a href="/reset-password">Request a replacement code</a><br><a href="${GUEST_ORIGIN}/">Back to the invitation</a></main>`;document.querySelector('#code-login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const result=await api('/api/code-login',{code:new FormData(e.target).get('code'),password:new FormData(e.target).get('password')});location.href=result.next||'/dashboard'}catch(e){error(e);b.disabled=false}}}

}</script></body></html>
